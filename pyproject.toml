[project]
name = "sg-law-cookies"
version = "0.1.0"
description = ""
authors = [{ name = "houfu", email = "houfu@outlook.sg" }]
requires-python = "~=3.10"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.0,<2",
    "beautifulsoup4>=4.11.2,<5",
    "lxml>=5.3.0,<6",
    "requests>=2.31.0,<3",
    "jinja2>=3.1.2,<4",
    "langchain>=0.2.15,<0.3",
    "html5lib~=1.1",
    "pydantic>=2.5.0,<3",
    "langchain-openai>=0.1.23,<0.2",
    "langchain-community>=0.2.15,<0.3",
]

[tool.hatch.build.targets.sdist]
include = ["sg_law_cookies"]

[tool.hatch.build.targets.wheel]
include = ["sg_law_cookies"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
